<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>agent-mem | Live Activity Stream</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen">
  <header class="border-b border-slate-800 bg-slate-900/90 backdrop-blur sticky top-0 z-20 px-6 py-4 flex flex-wrap items-center justify-between gap-4">
    <div class="flex items-center space-x-3">
      <div class="h-3 w-3 rounded-full bg-emerald-500 animate-pulse"></div>
      <h1 class="text-xl font-bold tracking-tight">agent-mem <span class="text-xs font-normal text-slate-400 bg-slate-800 px-2 py-0.5 rounded ml-2">Live Stream</span></h1>
      <select id="projectSelect" class="bg-slate-800 border border-slate-700 text-xs px-2.5 py-1.5 rounded-lg text-slate-200 focus:outline-none focus:border-indigo-500">
        <option value="">All Projects</option>
      </select>
    </div>
    <div class="flex items-center space-x-4">
      <div class="relative">
        <input id="searchInput" type="text" placeholder="Search memory (FTS5)..." class="bg-slate-800 border border-slate-700 text-sm px-3 py-1.5 rounded-lg w-64 focus:outline-none focus:border-indigo-500" />
        <button id="clearSearch" class="hidden absolute right-2.5 top-2 text-slate-400 hover:text-white text-xs">&times;</button>
      </div>
      <label class="flex items-center gap-1.5 text-xs text-slate-300 whitespace-nowrap cursor-pointer">
        <input id="autoReload" type="checkbox" checked class="accent-indigo-500" />
        Auto-reload
      </label>
      <span id="connStatus" class="text-xs text-emerald-400 font-medium whitespace-nowrap">● Connected</span>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-6 py-8 grid grid-cols-1 md:grid-cols-3 gap-6">
    <section class="md:col-span-2 space-y-4">
      <div class="flex items-center justify-between">
        <h2 id="feedTitle" class="text-lg font-semibold text-slate-200">Recent Observations</h2>
        <span id="feedCount" class="text-xs text-slate-500 font-mono">Loading...</span>
      </div>
      <div id="eventsFeed" class="space-y-3">
        <div class="text-sm text-slate-500 italic p-6 bg-slate-900/40 rounded-lg border border-slate-800/80 text-center">
          Loading memory history...
        </div>
      </div>
    </section>

    <aside class="space-y-6">
      <div class="bg-slate-900/60 p-5 rounded-xl border border-slate-800">
        <h3 class="text-sm font-semibold uppercase tracking-wider text-slate-400 mb-3">Memory Stats</h3>
        <dl class="space-y-2 text-sm">
          <div class="flex justify-between"><dt class="text-slate-500">Active Sessions</dt><dd id="statSessions" class="font-mono text-indigo-400">0</dd></div>
          <div class="flex justify-between"><dt class="text-slate-500">Total Observations</dt><dd id="statObs" class="font-mono text-emerald-400">0</dd></div>
          <div class="flex justify-between"><dt class="text-slate-500">Registered Projects</dt><dd id="statProjects" class="font-mono text-purple-400">0</dd></div>
        </dl>
      </div>

      <div class="bg-slate-900/60 p-5 rounded-xl border border-slate-800 space-y-3">
        <div class="flex items-center justify-between">
          <h3 class="text-sm font-semibold uppercase tracking-wider text-slate-400">Recent Sessions</h3>
          <span id="sessionsCount" class="text-xs text-slate-500 font-mono">0</span>
        </div>
        <div id="sessionsFeed" class="space-y-2.5 max-h-[30rem] overflow-y-auto pr-1">
          <div class="text-xs text-slate-500 italic text-center py-4">No recent sessions found</div>
        </div>
      </div>
    </aside>
  </main>

  <div id="drawer" class="hidden fixed inset-y-0 right-0 z-30 w-full md:w-[56rem] max-w-full bg-slate-900 border-l border-slate-700 shadow-2xl flex flex-col p-5">
    <div class="flex justify-between items-start gap-3 mb-3">
      <h4 id="drawerTitle" class="text-sm font-bold text-slate-200 break-words">Citation Details</h4>
      <button onclick="closeDrawer()" aria-label="Close details" class="text-slate-400 hover:text-white text-xl leading-none">&times;</button>
    </div>
    <div class="flex items-center justify-between text-xs font-mono text-slate-400 mb-3 pb-2 border-b border-slate-800">
      <span id="drawerType" class="text-indigo-400 font-semibold"></span>
      <span id="drawerTokens" class="text-slate-500"></span>
    </div>
    <pre id="drawerContent" class="flex-1 min-h-0 text-xs bg-slate-950 p-3 rounded text-slate-300 font-mono overflow-auto whitespace-pre-wrap break-words"></pre>
  </div>

  <script>
    const feed = document.getElementById("eventsFeed");
    const searchInput = document.getElementById("searchInput");
    const clearSearch = document.getElementById("clearSearch");
    const projectSelect = document.getElementById("projectSelect");
    const feedTitle = document.getElementById("feedTitle");
    const feedCount = document.getElementById("feedCount");
    const sessionsFeed = document.getElementById("sessionsFeed");
    const sessionsCount = document.getElementById("sessionsCount");

    const autoReload = document.getElementById("autoReload");

    // The digest links to /p/<project-id>; that id scopes everything the page loads
    function projectFromUrl() {
      const match = location.pathname.match(/^\/p\/([^/]+)/);
      return match ? decodeURIComponent(match[1]) : "";
    }

    let currentProject = projectFromUrl();
    let searchTimeout = null;
    let reloadTimeout = null;

    function formatTime(timestamp) {
      if (!timestamp) return "";
      const diffSec = Math.floor((Date.now() - timestamp) / 1000);
      if (diffSec < 60) return "just now";
      const diffMin = Math.floor(diffSec / 60);
      if (diffMin < 60) return `${diffMin}m ago`;
      const diffHours = Math.floor(diffMin / 60);
      if (diffHours < 24) return `${diffHours}h ago`;
      return `${Math.floor(diffHours / 24)}d ago`;
    }

    function getObservationStyle(type) {
      if (!type) return { border: "border-l-4 border-l-slate-700", badge: "bg-slate-800 text-slate-300 border-slate-700" };
      if (type === "user_prompt") {
        return { border: "border-l-4 border-l-sky-500", badge: "bg-sky-500/20 text-sky-300 border-sky-500/40" };
      }
      if (type === "assistant_reply") {
        return { border: "border-l-4 border-l-purple-500", badge: "bg-purple-500/20 text-purple-300 border-purple-500/40" };
      }
      if (type.includes("edit") || type.includes("write") || type.includes("patch") || type.includes("replace")) {
        return { border: "border-l-4 border-l-emerald-500", badge: "bg-emerald-500/20 text-emerald-300 border-emerald-500/40" };
      }
      if (type.includes("command") || type.includes("bash") || type.includes("exec")) {
        return { border: "border-l-4 border-l-amber-500", badge: "bg-amber-500/20 text-amber-300 border-amber-500/40" };
      }
      return { border: "border-l-4 border-l-indigo-500/70", badge: "bg-indigo-500/20 text-indigo-300 border-indigo-500/40" };
    }

    function createObservationCard(data) {
      const card = document.createElement("div");
      const style = getObservationStyle(data.type);
      card.className = `p-4 bg-slate-900/90 border border-slate-800 rounded-lg hover:border-slate-700 transition cursor-pointer hover:bg-slate-900 shadow-sm ${style.border}`;
      card.onclick = () => openDrawer(data);

      const header = document.createElement("div");
      header.className = "flex justify-between items-start mb-1.5";

      const left = document.createElement("div");
      left.className = "flex items-center space-x-2";

      const idSpan = document.createElement("span");
      idSpan.className = "text-xs font-mono text-indigo-400 font-semibold";
      idSpan.textContent = `[${data.id}]`;

      const typeBadge = document.createElement("span");
      typeBadge.className = `text-[10px] font-mono px-1.5 py-0.5 rounded border ${style.badge}`;
      typeBadge.textContent = data.type || "observation";

      left.appendChild(idSpan);
      left.appendChild(typeBadge);

      const right = document.createElement("div");
      right.className = "flex items-center space-x-2 text-xs text-slate-500 font-mono";

      if (data.createdAt) {
        const timeSpan = document.createElement("span");
        timeSpan.textContent = formatTime(data.createdAt);
        right.appendChild(timeSpan);
      }

      const tokensSpan = document.createElement("span");
      tokensSpan.textContent = `~${data.tokensApprox || 0} tok`;
      right.appendChild(tokensSpan);

      header.appendChild(left);
      header.appendChild(right);

      const summaryP = document.createElement("p");
      summaryP.className = "text-sm text-slate-200 leading-snug";
      summaryP.textContent = data.summary || "No summary";

      card.appendChild(header);
      card.appendChild(summaryP);
      return card;
    }

    function createSessionSummaryCard(session) {
      const card = document.createElement("div");
      const agentStyles = {
        claude: {
          border: "border-l-4 border-l-amber-500 border-slate-800 bg-gradient-to-r from-amber-500/10 via-slate-900/90 to-slate-900 hover:border-amber-500/60",
          badge: "bg-amber-500/20 text-amber-300 border-amber-500/40",
          name: "Claude Code",
        },
        antigravity: {
          border: "border-l-4 border-l-indigo-500 border-slate-800 bg-gradient-to-r from-indigo-500/10 via-slate-900/90 to-slate-900 hover:border-indigo-500/60",
          badge: "bg-indigo-500/20 text-indigo-300 border-indigo-500/40",
          name: "Antigravity",
        },
        codex: {
          border: "border-l-4 border-l-emerald-500 border-slate-800 bg-gradient-to-r from-emerald-500/10 via-slate-900/90 to-slate-900 hover:border-emerald-500/60",
          badge: "bg-emerald-500/20 text-emerald-300 border-emerald-500/40",
          name: "Codex",
        },
      };

      const style = agentStyles[session.agentType?.toLowerCase()] || {
        border: "border-l-4 border-l-sky-500 border-slate-800 bg-gradient-to-r from-sky-500/10 via-slate-900/90 to-slate-900 hover:border-sky-500/60",
        badge: "bg-sky-500/20 text-sky-300 border-sky-500/40",
        name: session.agentType || "Agent",
      };

      card.className = `group p-3 rounded-lg border transition-all cursor-pointer shadow-sm hover:shadow-md ${style.border}`;
      card.onclick = () => openSessionDrawer(session);

      // Header row with agent pill & timestamp
      const header = document.createElement("div");
      header.className = "flex justify-between items-center mb-1.5";

      const left = document.createElement("div");
      left.className = "flex items-center gap-2";

      const badge = document.createElement("span");
      badge.className = `text-[10px] font-mono font-medium px-2 py-0.5 rounded-full border ${style.badge}`;
      badge.textContent = style.name;
      left.appendChild(badge);

      if (session.status === "active") {
        const live = document.createElement("span");
        live.className = "inline-flex items-center gap-1 text-[10px] text-emerald-400 font-mono";
        live.innerHTML = '<span class="h-1.5 w-1.5 rounded-full bg-emerald-400 animate-pulse"></span>live';
        left.appendChild(live);
      }

      const timeSpan = document.createElement("span");
      timeSpan.className = "text-[11px] text-slate-400 font-mono";
      timeSpan.textContent = formatTime(session.startedAt);

      header.appendChild(left);
      header.appendChild(timeSpan);
      card.appendChild(header);

      // Session Title / Recap
      const titleEl = document.createElement("h4");
      titleEl.className = "text-sm font-semibold text-slate-100 group-hover:text-white transition leading-snug";
      titleEl.textContent = session.title || session.summary || "Working session";
      card.appendChild(titleEl);

      // Session summary & edited file chips
      if (session.summary) {
        const editMatch = session.summary.match(/edited\s+([^+]+)(?:\s+\+(\d+))?/);
        if (editMatch) {
          const filesDiv = document.createElement("div");
          filesDiv.className = "flex flex-wrap gap-1 mt-2";
          const files = editMatch[1].split(",").map((f) => f.trim());
          for (const file of files) {
            const chip = document.createElement("span");
            chip.className = "text-[10px] font-mono px-1.5 py-0.5 bg-slate-800 text-indigo-300 rounded border border-slate-700/60";
            chip.textContent = file;
            filesDiv.appendChild(chip);
          }
          if (editMatch[2]) {
            const extraChip = document.createElement("span");
            extraChip.className = "text-[10px] font-mono px-1.5 py-0.5 bg-slate-800 text-slate-400 rounded border border-slate-700/60";
            extraChip.textContent = `+${editMatch[2]} more`;
            filesDiv.appendChild(extraChip);
          }
          card.appendChild(filesDiv);
        } else if (session.summary !== session.title) {
          const summaryP = document.createElement("p");
          summaryP.className = "text-xs text-slate-300 mt-1 line-clamp-2 leading-relaxed";
          summaryP.textContent = session.summary;
          card.appendChild(summaryP);
        }
      }

      // Footer
      const footer = document.createElement("div");
      footer.className = "mt-2 pt-1.5 border-t border-slate-800/70 text-[10px] font-mono text-slate-500 flex justify-between items-center";
      footer.innerHTML = `<span>${session.id}</span><span class="text-indigo-400 group-hover:text-indigo-300">View handoff &rarr;</span>`;
      card.appendChild(footer);

      return card;
    }

    function renderSessions(sessions) {
      sessionsFeed.innerHTML = "";
      if (!sessions || sessions.length === 0) {
        const empty = document.createElement("div");
        empty.className = "text-xs text-slate-500 italic text-center py-4";
        empty.textContent = "No recent sessions found";
        sessionsFeed.appendChild(empty);
        sessionsCount.textContent = "0";
        return;
      }

      sessionsCount.textContent = `${sessions.length}`;
      for (const ses of sessions) {
        sessionsFeed.appendChild(createSessionSummaryCard(ses));
      }
    }

    function renderObservations(observations) {
      feed.innerHTML = "";
      if (!observations || observations.length === 0) {
        const empty = document.createElement("div");
        empty.className = "text-sm text-slate-500 italic p-8 bg-slate-900/30 rounded-lg border border-slate-800/80 text-center";
        empty.textContent = "No observations found in memory. Start an agent turn to see memories appear!";
        feed.appendChild(empty);
        feedCount.textContent = "0 items";
        return;
      }

      feedCount.textContent = `${observations.length} item${observations.length === 1 ? "" : "s"}`;
      for (const obs of observations) {
        feed.appendChild(createObservationCard(obs));
      }
    }

    async function loadStats() {
      try {
        const query = currentProject ? `?project=${encodeURIComponent(currentProject)}` : "";
        const res = await fetch(`/api/stats${query}`);
        if (res.ok) {
          const stats = await res.json();
          document.getElementById("statSessions").textContent = stats.activeSessions ?? 0;
          document.getElementById("statObs").textContent = stats.totalObservations ?? 0;
          if (stats.projects && stats.projects.length > 0) {
            document.getElementById("statProjects").textContent = stats.projects.length;
            projectSelect.innerHTML = '<option value="">All Projects</option>';
            for (const p of stats.projects) {
              const opt = document.createElement("option");
              opt.value = p.id;
              opt.textContent = p.name || p.id;
              projectSelect.appendChild(opt);
            }
            projectSelect.value = currentProject;
          }
        }
      } catch (err) {
        console.error("Error loading stats:", err);
      }
    }

    async function loadRecentSessions() {
      try {
        const query = currentProject ? `?project=${encodeURIComponent(currentProject)}` : "";
        const res = await fetch(`/api/sessions${query}`);
        if (res.ok) {
          const data = await res.json();
          renderSessions(data.sessions || []);
        }
      } catch (err) {
        console.error("Error loading sessions:", err);
      }
    }

    async function loadRecentObservations() {
      try {
        feedTitle.textContent = "Recent Observations";
        const query = currentProject ? `?project=${encodeURIComponent(currentProject)}&limit=50` : "?limit=50";
        const res = await fetch(`/api/observations${query}`);
        if (res.ok) {
          const data = await res.json();
          renderObservations(data.observations || []);
        }
      } catch (err) {
        console.error("Error loading observations:", err);
      }
    }

    async function performSearch(query) {
      if (!query.trim()) {
        clearSearch.classList.add("hidden");
        loadRecentObservations();
        return;
      }
      clearSearch.classList.remove("hidden");
      feedTitle.textContent = `Search results for "${query}"`;
      try {
        const projParam = currentProject ? `&project=${encodeURIComponent(currentProject)}` : "";
        const res = await fetch(`/api/search?q=${encodeURIComponent(query)}${projParam}&limit=50`);
        if (res.ok) {
          const data = await res.json();
          renderObservations(data.results || []);
        }
      } catch (err) {
        console.error("Search failed:", err);
      }
    }

    // Search events
    searchInput.addEventListener("input", (e) => {
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(() => {
        performSearch(e.target.value);
      }, 200);
    });

    clearSearch.addEventListener("click", () => {
      searchInput.value = "";
      clearSearch.classList.add("hidden");
      loadRecentObservations();
    });

    // Reload whatever the feed is showing: search results while a query is typed, otherwise recent observations
    function loadFeed() {
      if (searchInput.value.trim()) {
        performSearch(searchInput.value.trim());
      } else {
        loadRecentObservations();
      }
    }

    function loadAll() {
      loadStats();
      loadRecentSessions();
      loadFeed();
    }

    // A burst of hook events (one per tool call or chat turn) becomes a single reload
    function scheduleReload() {
      if (!autoReload.checked) return;
      clearTimeout(reloadTimeout);
      reloadTimeout = setTimeout(loadAll, 400);
    }

    projectSelect.addEventListener("change", (e) => {
      currentProject = e.target.value;
      history.pushState(null, "", currentProject ? `/p/${encodeURIComponent(currentProject)}` : "/");
      loadAll();
    });

    window.addEventListener("popstate", () => {
      currentProject = projectFromUrl();
      loadAll();
    });

    try {
      autoReload.checked = localStorage.getItem("agent-mem:auto-reload") !== "off";
    } catch {}
    autoReload.addEventListener("change", () => {
      try {
        localStorage.setItem("agent-mem:auto-reload", autoReload.checked ? "on" : "off");
      } catch {}
      if (autoReload.checked) loadAll();
    });

    // Relative times ("2m ago") and anything missed while the tab slept go stale without a periodic reload
    setInterval(() => {
      if (autoReload.checked && !document.hidden) loadAll();
    }, 30000);

    // SSE Real-Time Listener
    const sse = new EventSource("/api/stream");

    let connectedBefore = false;
    sse.onopen = () => {
      document.getElementById("connStatus").textContent = "● Connected";
      document.getElementById("connStatus").className = "text-xs text-emerald-400 font-medium";
      // Events sent while the stream was down are gone; catch up on reconnect
      if (connectedBefore) scheduleReload();
      connectedBefore = true;
    };

    // Reload from the server rather than patching the page, so replaced observations and search results stay correct
    for (const eventName of ["observation", "session_start", "session_update", "session_end"]) {
      sse.addEventListener(eventName, (e) => {
        const data = JSON.parse(e.data);
        if (currentProject && data.projectId && data.projectId !== currentProject) return;
        scheduleReload();
      });
    }

    sse.onerror = () => {
      document.getElementById("connStatus").textContent = "○ Reconnecting...";
      document.getElementById("connStatus").className = "text-xs text-amber-400 font-medium";
    };

    function openDrawer(obs) {
      document.getElementById("drawer").classList.remove("hidden");
      document.getElementById("drawerTitle").textContent = `${obs.id} - ${obs.summary || ""}`;
      document.getElementById("drawerType").textContent = `Type: ${obs.type || "observation"}`;
      document.getElementById("drawerTokens").textContent = `~${obs.tokensApprox || 0} tokens`;
      document.getElementById("drawerContent").textContent = obs.content || "No raw content attached.";
    }

    function openSessionDrawer(session) {
      document.getElementById("drawer").classList.remove("hidden");
      document.getElementById("drawerTitle").textContent = session.title || session.id;
      document.getElementById("drawerType").textContent = `${session.agentType} · ${session.status}`;
      document.getElementById("drawerTokens").textContent = formatTime(session.startedAt);
      const lines = [
        `=== SESSION: ${session.id} ===`,
        `Agent: ${session.agentType}`,
        `Status: ${session.status}`,
        `Started: ${new Date(session.startedAt).toLocaleString()}`,
        session.endedAt ? `Ended: ${new Date(session.endedAt).toLocaleString()}` : "",
        session.title ? `Title: ${session.title}` : "",
        session.summary ? `Summary: ${session.summary}` : "",
        session.transcriptPath ? `Transcript: ${session.transcriptPath}` : "",
        "",
        "Handoff inspection command:",
        `agent-mem handoff ${session.id}`,
      ].filter(Boolean);
      document.getElementById("drawerContent").textContent = lines.join("\n");
    }

    function closeDrawer() {
      document.getElementById("drawer").classList.add("hidden");
    }

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") closeDrawer();
    });

    // Initial load
    loadAll();
  </script>
</body>
</html>
