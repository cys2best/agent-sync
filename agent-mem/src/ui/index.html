<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>agent-mem | Live Activity Stream</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen">
  <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-20 px-6 py-4 flex items-center justify-between">
    <div class="flex items-center space-x-3">
      <div class="h-3 w-3 rounded-full bg-emerald-500 animate-pulse"></div>
      <h1 class="text-xl font-bold tracking-tight">agent-mem <span class="text-xs font-normal text-slate-400 bg-slate-800 px-2 py-0.5 rounded ml-2">Live Stream</span></h1>
    </div>
    <div class="flex items-center space-x-4">
      <input id="searchInput" type="text" placeholder="Search memory (FTS5)..." class="bg-slate-800 border border-slate-700 text-sm px-3 py-1.5 rounded-lg w-64 focus:outline-none focus:border-indigo-500" />
      <span id="connStatus" class="text-xs text-emerald-400 font-medium">● Connected</span>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-6 py-8 grid grid-cols-1 md:grid-cols-3 gap-6">
    <section class="md:col-span-2 space-y-4">
      <h2 class="text-lg font-semibold text-slate-200">Real-Time Event Stream</h2>
      <div id="eventsFeed" class="space-y-3">
        <div class="text-sm text-slate-500 italic p-4 bg-slate-900/40 rounded-lg border border-slate-800/80">
          Listening for agent session events and tool executions...
        </div>
      </div>
    </section>

    <aside class="space-y-6">
      <div class="bg-slate-900/60 p-5 rounded-xl border border-slate-800">
        <h3 class="text-sm font-semibold uppercase tracking-wider text-slate-400 mb-3">Memory Stats</h3>
        <dl class="space-y-2 text-sm">
          <div class="flex justify-between"><dt class="text-slate-500">Active Sessions</dt><dd id="statSessions" class="font-mono text-indigo-400">1</dd></div>
          <div class="flex justify-between"><dt class="text-slate-500">Observations</dt><dd id="statObs" class="font-mono text-emerald-400">0</dd></div>
          <div class="flex justify-between"><dt class="text-slate-500">Privacy Blocks</dt><dd id="statPrivacy" class="font-mono text-amber-400">0</dd></div>
        </dl>
      </div>

      <div id="drawer" class="hidden bg-slate-900 p-5 rounded-xl border border-slate-700">
        <div class="flex justify-between items-center mb-2">
          <h4 id="drawerTitle" class="text-sm font-bold text-slate-200">Citation Details</h4>
          <button onclick="closeDrawer()" class="text-slate-400 hover:text-white text-xs">&times; Close</button>
        </div>
        <p id="drawerType" class="text-xs text-indigo-400 font-mono mb-2"></p>
        <pre id="drawerContent" class="text-xs bg-slate-950 p-3 rounded text-slate-300 font-mono overflow-x-auto max-h-64"></pre>
      </div>
    </aside>
  </main>

  <script>
    const feed = document.getElementById("eventsFeed");
    const sse = new EventSource("/api/stream");

    sse.addEventListener("observation", (e) => {
      const data = JSON.parse(e.data);
      const card = document.createElement("div");
      card.className = "p-4 bg-slate-900 border border-slate-800 rounded-lg hover:border-slate-700 transition cursor-pointer";
      card.onclick = () => openDrawer(data);
      card.innerHTML = `
        <div class="flex justify-between items-start mb-1">
          <span class="text-xs font-mono text-indigo-400 font-semibold">[${data.id}]</span>
          <span class="text-xs text-slate-500">~${data.tokensApprox} tokens</span>
        </div>
        <p class="text-sm text-slate-200">${data.summary}</p>
      `;
      feed.prepend(card);
    });

    sse.onerror = () => {
      document.getElementById("connStatus").textContent = "○ Reconnecting...";
      document.getElementById("connStatus").className = "text-xs text-amber-400 font-medium";
    };

    function openDrawer(obs) {
      document.getElementById("drawer").classList.remove("hidden");
      document.getElementById("drawerTitle").textContent = obs.id + " - " + obs.summary;
      document.getElementById("drawerType").textContent = "Type: " + obs.type;
      document.getElementById("drawerContent").textContent = obs.content;
    }

    function closeDrawer() {
      document.getElementById("drawer").classList.add("hidden");
    }
  </script>
</body>
</html>
